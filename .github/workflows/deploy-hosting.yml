name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hosting/public/**"
      - "firebase.json"
      - ".github/workflows/deploy-hosting.yml"

concurrency:
  group: deploy-gundemai-hosting
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Publish Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUNDEMAI }}
          channelId: live
          projectId: gundemai
